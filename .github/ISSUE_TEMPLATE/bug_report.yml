name: Bug report / 缺陷反馈
description: Report a reproducible problem in CodeHandover.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CodeHandover. Please provide enough context so we can reproduce the issue.

        感谢反馈问题。请尽量提供可复现信息，方便定位真实原因。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: CodeHandover version or commit hash.
      placeholder: "v1.0.0 / commit hash"
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: List the exact actions or commands that trigger the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Include screenshots or logs if useful. Please remove secrets, tokens, and private repo URLs.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Project language/framework, Git author filter, time range, or export type if related.
    validations:
      required: false
