name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Quality gate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

  windows:
    name: Windows ${{ matrix.arch }} packages
    runs-on: windows-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            script: electron:build:win:x64
          - arch: ia32
            script: electron:build:win:ia32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows packages
        run: npm run ${{ matrix.script }}

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: CodeHandover-Windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.msi
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} packages
    runs-on: ${{ matrix.runner }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            script: electron:build:mac:x64
          - arch: arm64
            runner: macos-14
            script: electron:build:mac:arm64

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use native npm script shell
        run: npm config delete script-shell

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS packages
        run: npm run ${{ matrix.script }}

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: CodeHandover-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos

    steps:
      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: CodeHandover ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.blockmap
            release-artifacts/*.yml
